# Hermes configuration ("Configuration C").
# Secrets are NOT here — they come from .secrets/.env via ${VAR} substitution.

company:                              # who WE are — the SUPPLIER on every customer PO
  legal_name: UNICONTROL Y GABINETES DEL PACIFICO S DE RL DE CV
  rfc: UGP230914LI2
  aka: [Unicontrol, Unicontrol y Gabinetes del Pacifico]

gmail:
  account: pounicontrol@gmail.com
  oauth_client_path: ./.secrets/google_oauth_client.json   # OAuth Desktop client JSON
  token_path: ./.secrets/gmail_token.json                  # minted on first consent
  # Unread-only + mark-read on label (NOT label exclusion): Gmail gives a reply
  # arriving into a labeled conversation the thread's labels, so "-label:X"
  # permanently hides new thread replies. newer_than bounds the cutover backlog.
  poll_query: "is:unread has:attachment filename:pdf newer_than:7d"
  labels:
    processed: Hermes/Processed
    needs_review: Hermes/NeedsReview

odoo:
  url: https://unicontrol.odoo.com
  db: unicontrol
  username: ${ODOO_USERNAME}        # Unicontrolbot login email
  api_key_env: ODOO_API_KEY         # value lives in .secrets/.env

sheets:
  spreadsheet_id: ${SHEETS_SPREADSHEET_ID}                # PO Tracker workbook
  quotes_spreadsheet_id: ${SHEETS_QUOTES_SPREADSHEET_ID}  # separate Quotes workbook (Quotes + Pricing Queue + its own Audit)
  inventory_spreadsheet_id: ${SHEETS_INVENTORY_SPREADSHEET_ID}  # human-kept stock workbook (read-only for Hermes)
  service_account_path: ./.secrets/google_service_account.json
  tabs:
    orders: Orders
    dashboard: Dashboard
    people: Salespeople
    audit: Audit
    quotes: Quotes
    pricing_queue: Pricing Queue
    inventory: Actualizacion

rfq:
  # Team convention: forward RFQ emails with "RFQ" in the subject.
  poll_query: 'is:unread subject:RFQ newer_than:7d'   # same unread+mark-read scheme as gmail.poll_query above
  labels:
    processed: Hermes/Processed        # reuse existing labels
    needs_review: Hermes/NeedsReview
  match:
    fuzzy_threshold: 88       # >= this token_set_ratio -> candidate match
    ambiguity_margin: 3       # top-2 scores closer than this -> queue, never guess
    partner_threshold: 85     # customer-name fuzzy floor to pick the Odoo partner
  # Extracted customer name (lowercased) -> exact Odoo partner name, for customers whose
  # email-domain name differs from their Odoo legal name.
  customer_aliases:
    abc aluminum: Aluminio de Baja California
    abc: Aluminio de Baja California
  # Distributor catalogs searched FIRST for web price research (site: queries).
  preferred_supplier_sites:
    - idsupply.com.mx
  # Applied to every product Hermes creates (accounts looked up by code; UNSPSC
  # proposed by the LLM and set only when the code exists in Odoo's catalog).
  product_defaults:
    income_account: "401.01.01"    # POR COBRAR: Ventas y/o servicios gravados a la tasa general
    expense_account: "502.01.01"   # POR PAGAR: Compras
    unspsc: true
    unspsc_fallback: "20121445"    # Accesorios y partes — used when a confident pick isn't possible

llm:
  # provider-agnostic: OpenAI SDK + base_url. Works for OpenAI or GLM/Zhipu.
  base_url: ${LLM_BASE_URL}         # OpenAI: https://api.openai.com/v1
                                    # GLM:    https://open.bigmodel.cn/api/paas/v4
  api_key_env: LLM_API_KEY
  model: ${LLM_MODEL}               # text model, e.g. gpt-4o-mini / glm-4.6
  vision_model: ${LLM_VISION_MODEL} # for scanned/image POs, e.g. gpt-4o / glm-4v

serper:
  # Google search via serper.dev — used for web price research + product images
  # when the key is set (better exact-SKU retrieval than LLM web search).
  # Leave the env var unset to fall back to OpenAI web_search.
  api_key_env: SERPER_API_KEY

matching:
  candidate_states: [draft, sent]
  lookback_days: 120
  amount_tolerance_pct: 0.5         # tight: only near-exact totals auto-match; else Needs-review
  compare: untaxed_total
  confidence_threshold: 0.85        # >= confident; else Needs-review

write:                              # Odoo write on confident match
  customer_ref_field: client_order_ref
  attach_pdf: true
  post_chatter_note: true
  po_in_terms: true                 # append "PO Cliente: <po#>" to the quote's T&C (note)
  auto_confirm_so: false            # annotate only — NEVER confirm

invoice:
  detect_from: invoice_status
  require_human_confirm: true       # hybrid close

reminders:
  daily_digest_time: "07:00"
  timezone: America/Tijuana
  manager_rollup_to: []
  weekly_dashboard_refresh: "Mon 06:30"

runtime:
  dry_run: true                     # start safe: log intended actions, write nothing
  log_level: INFO

pricebook:
  # RFQ quote pricing when the email states no margin: sale = cost / (1 - pct/100).
  # Margin is on the SELLING price (30% -> cost / 0.7), per user rule 2026-08-12.
  default_margin_pct: 30
  # Pricelist IMPORT markup (import_pricelist.py): sale = cost * (1 + pct/100).
  default_markup_pct: 25
  # Email-granted customer discount cap (quotes pipeline): above this the draft
  # is created at LIST price and flagged for approval — never auto-granted.
  max_discount_pct: 15
  # Local pricebooks (core/pricebook.py): big distributor lists the RFQ pipeline
  # reads directly — NOT imported into Odoo; products auto-create when quoted.
  # Quoted at the LIST price as-is (no extra margin unless the email says so).
  files:
    phoenix:
      path: "pricebooks/pxc-2026.xlsx"
      vendor_name: "Phoenix Contact"
      currency: USD
      mxn_fx_surcharge: 0.5        # quote MXN at official USD rate + 0.5 (user rule 2026-08-13)
      image_site: phoenixcontact.com  # product images ONLY from their site (no off-site fallback)
      header_row: 1
      columns:                     # header CELL TEXT (exact, case-insensitive)
        item: "Item number"        # article number (e.g. 706016)
        type: "Type description"   # model designation (e.g. DFK-2,8) -> product NAME
        list: "2026 PL"            # customer list price — quoted as-is
        cost: "2026 Distribuidor"  # our distributor cost (reference)
  brands:
    acme:                              # key used as --brand acme
      vendor_name: "ACME Distribution" # res.partner created/reused as the vendor
      markup_pct: 25                   # sale = cost * (1 + pct/100)
      header_row: 1                    # 1-based row holding the column headers
      columns:                         # header CELL TEXT (exact, case-insensitive)
        part: "Part Number"
        description: "Description"
        cost: "Net Price"
